  <g font-family="'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="62" y="78" font-size="15" fill="#7c3aed" letter-spacing="2">// COMPUTER VISION · MQTT · ESP32</text>
    <text x="58" y="134" font-size="44" font-weight="700" fill="#0f172a">GESTURE <tspan fill="#7c3aed">LED</tspan> CONTROL</text>
    <g clip-path="url(#typing)">
      <text x="62" y="176" font-size="19" fill="#57606a">lights that follow your hand <tspan fill="#0891b2">✋</tspan></text>
    </g>
    <rect x="62" y="160" width="10" height="20" fill="#7c3aed">
      <animate attributeName="x" values="62;414;414;62" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <g font-size="13" fill="#57606a">
      <text x="62" y="236"><tspan fill="#16a34a">●</tspan> MQTT ENABLED</text>
      <text x="62" y="258">RIGHT HAND  pinch → brightness</text>
      <text x="62" y="280">LEFT HAND   fingers → RGB</text>
      <text x="62" y="302">IDLE 30 S   → lights off</text>
    </g>
