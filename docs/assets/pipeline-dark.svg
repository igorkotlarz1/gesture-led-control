<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pipeline: camera, MediaPipe, gesture state machine, MQTT, ESP32">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#101a2e"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="330" rx="18"/></clipPath></defs>
  <g clip-path="url(#frame)"><rect width="1200" height="330" fill="url(#bg)"/></g>
  <g font-family="'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="52" y="54" font-size="20" font-weight="700" fill="#e6edf3">From pixels to photons</text>
    <text x="1148" y="54" font-size="13" fill="#8b93a7" text-anchor="end">camera frame → LED change in one loop</text>
    <rect x="52" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#22d3ee" stroke-width="1.5"/><rect x="52" y="92" width="184" height="36" rx="14" fill="#22d3ee" opacity="0.16"/><text x="70" y="116" font-size="13" font-weight="700" fill="#22d3ee" letter-spacing="2">01 CAMERA</text><text x="70" y="160" font-size="14" fill="#e6edf3">OpenCV capture</text><text x="70" y="192" font-size="14" fill="#e6edf3">640 × 480</text><text x="70" y="224" font-size="14" fill="#e6edf3">mirrored view</text><text x="70" y="256" font-size="14" fill="#e6edf3">control square</text><line x1="240" y1="190.0" x2="276" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="276,185.0 282,190.0 276,195.0" fill="#8b93a7"/><rect x="280" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#a78bfa" stroke-width="1.5"/><rect x="280" y="92" width="184" height="36" rx="14" fill="#a78bfa" opacity="0.16"/><text x="298" y="116" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="2">02 MEDIAPIPE</text><text x="298" y="160" font-size="14" fill="#e6edf3">21 hand landmarks</text><text x="298" y="192" font-size="14" fill="#e6edf3">left / right hand</text><text x="298" y="224" font-size="14" fill="#e6edf3">confidence 0.7</text><text x="298" y="256" font-size="14" fill="#e6edf3">skeleton overlay</text><line x1="468" y1="190.0" x2="504" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="504,185.0 510,190.0 504,195.0" fill="#8b93a7"/><rect x="508" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#f472b6" stroke-width="1.5"/><rect x="508" y="92" width="184" height="36" rx="14" fill="#f472b6" opacity="0.16"/><text x="526" y="116" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="2">03 GESTURES</text><text x="526" y="160" font-size="14" fill="#e6edf3">pinch calibration</text><text x="526" y="192" font-size="14" fill="#e6edf3">pinky = confirm</text><text x="526" y="224" font-size="14" fill="#e6edf3">fingers → RGB</text><text x="526" y="256" font-size="14" fill="#e6edf3">auto-off 30 s</text><line x1="696" y1="190.0" x2="732" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="732,185.0 738,190.0 732,195.0" fill="#8b93a7"/><rect x="736" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#facc15" stroke-width="1.5"/><rect x="736" y="92" width="184" height="36" rx="14" fill="#facc15" opacity="0.16"/><text x="754" y="116" font-size="13" font-weight="700" fill="#facc15" letter-spacing="2">04 MQTT</text><text x="754" y="160" font-size="14" fill="#e6edf3">paho-mqtt 2.x</text><text x="754" y="192" font-size="14" fill="#e6edf3">led/brightness</text><text x="754" y="224" font-size="14" fill="#e6edf3">led/color</text><text x="754" y="256" font-size="14" fill="#e6edf3">system/state</text><line x1="924" y1="190.0" x2="960" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="960,185.0 966,190.0 960,195.0" fill="#8b93a7"/><rect x="964" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#4ade80" stroke-width="1.5"/><rect x="964" y="92" width="184" height="36" rx="14" fill="#4ade80" opacity="0.16"/><text x="982" y="116" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="2">05 ESP32</text><text x="982" y="160" font-size="14" fill="#e6edf3">subscribes topics</text><text x="982" y="192" font-size="14" fill="#e6edf3">drives RGB LED</text><text x="982" y="224" font-size="14" fill="#e6edf3">PIR sensor</text><text x="982" y="256" font-size="14" fill="#e6edf3">firmware → soon</text>
  </g>
  <rect width="1200" height="330" rx="18" fill="none" stroke="#1f2a3d"/>
